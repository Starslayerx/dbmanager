[project]
name = "tencent-outsource-interview"
version = "0.1.0"
description = "Internal database instance management system"
readme = "README.md"
authors = [
    { name = "starslayerx", email = "starslayerx@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "celery[redis]",
    "cryptography>=50.0.2",
    "django>=5.2,<5.3",
    "django-celery-beat>=2.9.0",
    "django-ninja>=1.8,<2",
    "psycopg[binary]>=3.3.9",
    "pymysql>=1.2.4",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.2",
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = 'config.settings'
python_files = ['tests.py', 'test_*.py', '*_test.py']

[tool.ruff.lint.per-file-ignores]
"inventory/migrations/*.py" = ["RUF012"]
