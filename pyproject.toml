[project]
name = "tencent-outsource-interview"
version = "0.1.0"
description = "Internal database instance management system"
readme = "README.md"
authors = [
    { name = "starslayerx", email = "starslayerx@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "celery[redis]",
    "django>=5.2,<5.3",
    "django-ninja>=1.8,<2",
    "psycopg[binary]>=3.3.9",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = 'config.settings'
python_files = ['tests.py', 'test_*.py', '*_test.py']
